spring.application.name=backend

# Load local, uncommitted credentials when present. Deployment platforms supply
# the same values as environment variables, which take precedence.
spring.config.import=optional:file:.env[.properties]

# Deployment platforms commonly supply PORT; local development uses 8080.
server.port=${PORT:8080}
server.address=0.0.0.0

# Configure SPRING_DATASOURCE_* on any deployment platform. The defaults always
# target the local MySQL instance and never inherit provider-specific variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/petshop_pos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000

# Keep production logging and memory use modest. Override with environment
# variables only when diagnosing a problem.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# All credentials are supplied as environment variables; never commit them.
app.jwt.secret=${JWT_SECRET:change-this-development-jwt-secret-before-production-2026}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:8080,http://127.0.0.1:8080}
mpesa.consumerKey=${MPESA_CONSUMER_KEY:}
mpesa.consumerSecret=${MPESA_CONSUMER_SECRET:}
mpesa.shortCode=${MPESA_SHORT_CODE:}
mpesa.passKey=${MPESA_PASS_KEY:}
mpesa.callbackUrl=${MPESA_CALLBACK_URL:}
