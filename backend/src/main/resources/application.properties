spring.application.name=backend

# Railway supplies PORT. Locally this continues to use 8080.
server.port=${PORT:8080}
server.address=0.0.0.0

# Set SPRING_DATASOURCE_* in Railway. MYSQL* values make this work with a
# Railway MySQL service when its variables are shared with this service.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:petshop_pos}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000

# Keep production logging and memory use modest. Override with environment
# variables only when diagnosing a problem.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# All credentials are supplied as environment variables; never commit them.
app.jwt.secret=${JWT_SECRET:change-this-development-jwt-secret-before-production-2026}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8080}
mpesa.consumerKey=${MPESA_CONSUMER_KEY:}
mpesa.consumerSecret=${MPESA_CONSUMER_SECRET:}
mpesa.shortCode=${MPESA_SHORT_CODE:}
mpesa.passKey=${MPESA_PASS_KEY:}
mpesa.callbackUrl=${MPESA_CALLBACK_URL:}
